workflows:
  android-workflow:
    name: Build do Forum Jovem (APK)
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Baixar dependências
        script: flutter pub get
      - name: Gerar Ícone do App
        script: dart run flutter_launcher_icons
      - name: Compilar o APK
        script: flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
