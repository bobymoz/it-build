name: my_chat_app
description: Sample chat app using Supabase and Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.15.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Estes pacotes devem ficar alinhados exatamente na mesma direção da palavra "flutter" acima
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4

flutter:
  uses-material-design: true
